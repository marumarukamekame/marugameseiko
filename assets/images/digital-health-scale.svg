<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
<title id="title">デジタル表示付きの体重計</title><desc id="desc">明るい木目の上に置かれ、62.4キログラムを表示している清潔感のある白い体重計</desc>
<defs>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#f0e4cc"/><stop offset="1" stop-color="#d8bd91"/></linearGradient>
 <linearGradient id="body" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".6" stop-color="#f3f4f1"/><stop offset="1" stop-color="#dfe2de"/></linearGradient>
 <linearGradient id="metal"><stop stop-color="#babcb7"/><stop offset=".45" stop-color="#f0f0ed"/><stop offset="1" stop-color="#aaa9a4"/></linearGradient>
 <linearGradient id="lcd" x2="1" y2="1"><stop stop-color="#dcece6"/><stop offset="1" stop-color="#a8c6ba"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
 <pattern id="grain" width="180" height="60" patternUnits="userSpaceOnUse"><path d="M0 12C45 3 85 23 180 9M0 38c65 13 122-11 180 4" fill="none" stroke="#a88659" stroke-opacity=".18" stroke-width="3"/></pattern>
</defs>
<rect width="1600" height="1067" fill="url(#wood)"/><rect width="1600" height="1067" fill="url(#grain)"/>
<!-- plant and folded towel create a bright wellness setting -->
<g transform="translate(45 0)"><ellipse cx="50" cy="35" rx="150" ry="100" fill="#f3f0e5"/><g fill="#47754b"><ellipse cx="32" cy="10" rx="38" ry="100" transform="rotate(-42 32 10)"/><ellipse cx="120" cy="15" rx="37" ry="100" transform="rotate(12 120 15)"/><ellipse cx="215" cy="10" rx="36" ry="95" transform="rotate(48 215 10)"/><ellipse cx="5" cy="120" rx="34" ry="92" transform="rotate(-70 5 120)"/></g></g>
<g transform="translate(1120 -35)"><rect width="560" height="270" rx="35" fill="#f7f6f1"/><path d="M20 38h520M20 66h520M20 94h520M20 122h520M20 150h520M20 178h520M20 206h520" stroke="#dddcd6" stroke-width="5" opacity=".65"/></g>
<path d="M150 300L1170 200l330 745-1400 90z" fill="#6b5741" opacity=".26" filter="url(#shadow)"/>
<path d="M175 225L1190 160l300 790-1400 83z" fill="url(#body)" stroke="#cdd1cc" stroke-width="9"/>
<path d="M190 242l980-63" stroke="#fff" stroke-width="18" opacity=".9"/>
<!-- metal sensors -->
<g fill="url(#metal)" stroke="#aaaDa8" stroke-width="4">
 <rect x="210" y="340" width="210" height="325" rx="36"/><rect x="1090" y="290" width="190" height="285" rx="36"/>
 <rect x="210" y="750" width="225" height="250" rx="36"/><rect x="1110" y="690" width="250" height="260" rx="36"/>
</g>
<!-- display -->
<rect x="500" y="285" width="520" height="310" rx="42" fill="#899791" stroke="#69756f" stroke-width="8"/>
<rect x="528" y="313" width="464" height="254" rx="26" fill="url(#lcd)" stroke="#e4eee9" stroke-width="7"/>
<path d="M550 330h414L825 550H585z" fill="#fff" opacity=".15"/>
<text x="600" y="385" font-family="Arial,sans-serif" font-size="32" fill="#405851" letter-spacing="4">WEIGHT</text>
<text x="575" y="515" font-family="Arial,sans-serif" font-weight="700" font-size="132" fill="#263c36">62.4</text>
<text x="885" y="525" font-family="Arial,sans-serif" font-weight="700" font-size="35" fill="#334b44">kg</text>
<!-- controls -->
<g fill="#eff0ed" stroke="#c7cbc6" stroke-width="4"><rect x="600" y="635" width="165" height="90" rx="25"/><rect x="820" y="625" width="165" height="90" rx="25"/><rect x="685" y="790" width="225" height="86" rx="24"/></g>
<path d="M665 680l35-23v46zM920 670l-35-23v46z" fill="#8f9691"/><text x="731" y="842" font-family="Arial,sans-serif" font-size="23" fill="#686f6b">ON / OFF</text>
<path d="M190 245l970-62 82 217-1085 70z" fill="#fff" opacity=".12"/>
</svg>
